# one file is one agent. copy this to agents/mira.yaml, chmod it to 0600,
# and fill in the values. real agent files are ignored by git.
id: mira
name: Mira
home: ./data/agents/mira

# point at a client started with `npm run start` on another machine.
client: http://mira-macbook.local:3002

# to run tools on the server instead, replace `client` above with these lines:
# client: local
# workspace: /Users/mira

model:
  provider: openai
  name: openai/gpt-5
  baseUrl: https://openrouter.ai/api/v1
  apiKey: replace-me
  thinking: true

fallback:
  name: local-model
  baseUrl: http://127.0.0.1:1234/v1
  apiKey: local

embedding:
  name: google/gemini-embedding-2-preview
  baseUrl: https://openrouter.ai/api/v1
  apiKey: replace-me
  dimensions: 3072

discord:
  token: replace-me
  enabled: true
  wakeOnEvent: true
  gatewayTrace: false
  gatewayRawFallback: true
  batchIntervalMs: 60000
  batchOnlyConfigured: true
  pendingAutoSeenMinutes: 10
  batchScan: true
  batchMaxMessages: 40
  cooldownChannels: "channelId,2000,0400"
  cooldownTz: America/New_York
  # Optional private Discord forum where delegated tasks become multiplayer threads.
  # Every human member who can access the forum is equally authorized to steer tasks.
  gastownForumChannelId: "123456789012345678"

# Task workers get fresh context and only the client tools explicitly listed here.
# They cannot access Discord, memories, scheduling, posture, or nested delegation.
delegation:
  enabled: true
  maxConcurrent: 2
  timeoutMs: 1800000
  resultMaxChars: 6000
  profiles:
    - name: researcher
      model: gpt-5.6-luna
      systemPrompt: Inspect first, preserve unrelated work, and report evidence with exact paths.
      tools: [shell, read_file]
      mcpTools: [web_extract__web_search, web_extract__web_query, web_extract__web_summarize, web_extract__web_extract]
      maxTurns: 30
    - name: coder
      model: gpt-5.6-luna
      systemPrompt: Make the smallest correct change, then run focused verification and report every changed file.
      tools: [shell, read_file, write_file, edit_file]
      mcpTools: [web_extract__web_search, web_extract__web_query, web_extract__web_summarize, web_extract__web_extract]
      maxTurns: 40

# Named webhook endpoints live on the server at
# POST /agents/<agent-id>/trigger/webhook/<name>. HMAC-SHA256 is calculated
# over the exact request body bytes.
webhooks:
  github:
    secret: replace-me
    signatureHeader: x-hub-signature-256
    signaturePrefix: sha256=
  deploy:
    secret: replace-me-too
    # Defaults: signatureHeader: x-niri-signature
    #           signaturePrefix: sha256=

runtime:
  imageMaxBytes: 1000000
  primaryToolChoice: required
  fallbackToolChoice: required
  fallbackEnforceContextLimit: false
  contextCompactTriggerTokens: 90000
  contextCompactHardTriggerTokens: 115000
  contextCompactMinNewMessages: 24
  lcmSummaryBatchSize: 4
  migrateLegacyState: true
  maxTurns: 120
  antigravity:
    enabled: false
    port: 8000
    binaryPath: /home/niri/.local/bin/agy
  codex:
    enabled: true
    port: 8001
    model: gpt-5.6-sol
    reasoningEffort: low

# MCP servers run beside this agent's worker on the server. Their tools are
# exposed to the model as <server>__<tool> (for example, kagi__search).
mcp:
  kagi:
    url: https://mcp.example.com/mcp
    auth:
      type: bearer
      token: replace-me
    headers:
      X-Client-Name: mira
  filesystem:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/srv/shared"]
    env:
      LOG_LEVEL: warn

# uncommon runtime knobs can use their existing names here. lifecycle and
# topology values are managed by the server and rejected in this section.
settings: {}
